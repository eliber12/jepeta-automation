name: Deploy legacy Pages redirect

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build compatibility artifact
        run: |
          mkdir -p _site
          cp agent.json agents.json agents.txt index.md openapi.json llms.txt llms-full.txt sample-full-report.json _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex,follow">
            <link rel="canonical" href="https://eliber12.github.io/jepeta-core/">
            <meta http-equiv="refresh" content="0; url=https://eliber12.github.io/jepeta-core/">
            <title>Jepeta Risk Guard moved</title>
          </head>
          <body>
            <p>Jepeta Risk Guard moved to <a href="https://eliber12.github.io/jepeta-core/">the canonical production site</a>.</p>
            <script>location.replace('https://eliber12.github.io/jepeta-core/'+location.search+location.hash)</script>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
          cat > _site/robots.txt <<'TXT'
          User-agent: *
          Disallow: /
          TXT
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy compatibility redirect
        id: deployment
        uses: actions/deploy-pages@v4
