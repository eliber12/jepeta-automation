name: Deploy public Jepeta site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public-only repository
        run: node scripts/public-check.mjs
      - uses: actions/configure-pages@v5
      - name: Build static artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p _site
          cp index.html index.md site.css site.js agent.json agents.json agents.txt openapi.json llms.txt llms-full.txt sample-full-report.json robots.txt sitemap.xml .nojekyll _site/
          rsvg-convert -w 1200 -h 630 og-jepeta.svg -o _site/og-jepeta.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live production
        run: node scripts/live-smoke.mjs
